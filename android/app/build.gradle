plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
 namespace 'com.aboezzat.socialengine'
 compileSdk 35
 defaultConfig {
  applicationId 'com.aboezzat.socialengine'
  minSdk 24
  targetSdk 35
  versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
  versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
 buildTypes { release { minifyEnabled false } }
}
chaquopy {
 defaultConfig {
  version = "3.13"
  pip { install("yt-dlp") }
 }
}
dependencies {
 implementation 'org.nanohttpd:nanohttpd:2.3.1'
 implementation 'androidx.core:core:1.15.0'
}
