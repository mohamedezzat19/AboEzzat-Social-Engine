services:
  social-engine:
    build: .
    image: aboezzat-social-engine:local
    container_name: aboezzat-social-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      XDG_CACHE_HOME: /tmp/.cache
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
